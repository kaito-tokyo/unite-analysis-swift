name: unite-analysis-swift
version: 0.2.3
description: Pokémon UNITE recording evidence tools and match-review skill.
author: Kaito Udagawa
license: Apache-2.0
targets:
  - codex
includes: auto
dependencies:
  apm: []
  mcp:
    - name: unite-analysis-swift
      registry: false
      transport: stdio
      command: /bin/dash
      args:
        - -c
        - |
          expected_version=0.2.3
          for app in "$HOME/Applications/Kaito-Tokyo Unite Analysis.app" "/Applications/Kaito-Tokyo Unite Analysis.app"; do
            executable="$app/Contents/MacOS/unite-analysis-swift"
            if [ -x "$executable" ] && [ "$("$executable" --version 2>/dev/null)" = "$expected_version" ]; then
              exec "$executable" mcp
            fi
          done
          printf '%s\n' "unite-analysis-swift: install version $expected_version from https://github.com/kaito-tokyo/unite-analysis-swift/releases/latest" >&2
          exit 69
scripts: {}
