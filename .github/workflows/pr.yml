name: PR Check

on:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-ci:
    permissions:
      contents: read
    uses: ./.github/workflows/check.yml

  swift-ci:
    permissions:
      contents: read
    uses: ./.github/workflows/swift.yml
