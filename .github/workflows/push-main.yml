name: Push (main)

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-ci:
    permissions:
      contents: read
    uses: ./.github/workflows/check.yml

  swift-ci:
    permissions:
      contents: read
    uses: ./.github/workflows/swift-ci.yml
