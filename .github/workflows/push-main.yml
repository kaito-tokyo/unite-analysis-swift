name: Main push

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-ci:
    permissions:
      contents: read
    uses: ./.github/workflows/check-ci.yml

  swift-release:
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    uses: ./.github/workflows/swift.yml
    with:
      upload-artifacts: true
