name: PR Audit Check

# Keep the registered required workflow passing while Skill Audit is
# temporarily disabled. See AGENTS.md.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to audit
        required: true
        type: number

permissions: {}

concurrency:
  group: ${{ github.workflow }}-dispatcher-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  audit-ci:
    runs-on: ubuntu-slim
    permissions: {}
    steps:
      - name: Skip disabled Skill Audit
        run: echo 'Skill Audit is temporarily disabled.'
