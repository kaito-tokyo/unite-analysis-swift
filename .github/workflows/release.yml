name: Release macOS

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Verify release tag
        shell: pwsh -command "Set-StrictMode -Version Latest; $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; . '{0}'"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tagReference = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:GITHUB_REF_NAME" | ConvertFrom-Json
          if ($tagReference.object.type -ne 'tag') {
              throw "Release tag $env:GITHUB_REF_NAME must be an annotated tag."
          }
          $tag = gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$($tagReference.object.sha)" | ConvertFrom-Json
          if ($tag.tag -ne $env:GITHUB_REF_NAME) {
              throw "Annotated tag name $($tag.tag) does not match $env:GITHUB_REF_NAME."
          }
          if ($tag.object.type -ne 'commit' -or $tag.object.sha -ne $env:GITHUB_SHA) {
              throw "Release tag $env:GITHUB_REF_NAME does not point directly to commit $env:GITHUB_SHA."
          }
          if (-not $tag.verification.verified -or $tag.verification.reason -ne 'valid') {
              throw "Release tag $env:GITHUB_REF_NAME does not have a valid signature: $($tag.verification.reason)."
          }
          $payloadSeparator = $tag.verification.payload.IndexOf("`n`n")
          if ($payloadSeparator -lt 0) {
              throw "Release tag $env:GITHUB_REF_NAME has an invalid signed payload."
          }
          $signedMessage = $tag.verification.payload.Substring($payloadSeparator + 2)
          if ($signedMessage -ne "$env:GITHUB_REF_NAME`n") {
              throw "Release tag message must exactly match $env:GITHUB_REF_NAME."
          }

      - name: Set up APM
        uses: microsoft/apm-action@d723bb64ed70c135bbaf87d126b721dd2dae0439 # v1.10.0
        with:
          apm-version: 0.27.0
          setup-only: true

      - name: Validate APM package
        shell: bash --noprofile --norc -euo pipefail {0}
        run: apm pack --format plugin --offline --dry-run

      - name: Check release versions
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          ruby <<'RUBY'
          require "yaml"

          expected = ENV.fetch("RELEASE_VERSION").delete_prefix("v")

          def captured_version(path, pattern)
            contents = File.read(path)
            match = contents.match(pattern)
            abort "Missing version field in #{path}." unless match
            match[1]
          end

          versions = {
            "README.md" => captured_version(
              "README.md", %r{unite-analysis-swift#v([^`]+)}),
            "apm.yml" => YAML.safe_load(File.read("apm.yml")).fetch("version"),
            "Contents/Info.plist CFBundleShortVersionString" => captured_version(
              "Contents/Info.plist",
              %r{<key>CFBundleShortVersionString</key>\s*<string>([^<]+)</string>}),
            "Contents/Info.plist CFBundleVersion" => captured_version(
              "Contents/Info.plist",
              %r{<key>CFBundleVersion</key>\s*<string>([^<]+)</string>}),
            "Sources/UniteAnalysisSwiftTool/UniteAnalysisSwiftToolCommand.swift" =>
              captured_version(
                "Sources/UniteAnalysisSwiftTool/UniteAnalysisSwiftToolCommand.swift",
                /version:\s*"([^"]+)"/),
            "Sources/UniteAnalysisModelTool/UniteAnalysisModelToolCommand.swift" =>
              captured_version(
                "Sources/UniteAnalysisModelTool/UniteAnalysisModelToolCommand.swift",
                /version:\s*"([^"]+)"/),
            "Tests/LDTXRecordingSupportTests/ModelToolTests.swift" => captured_version(
              "Tests/LDTXRecordingSupportTests/ModelToolTests.swift",
              /modelBuiltInCLIOutput\(arguments: \["--version"\]\) == "([^"]+)"/),
          }

          versions.each do |location, actual|
            abort "Version in #{location} is #{actual}; expected #{expected}." unless actual == expected
          end
          RUBY

      - name: Check if the release commit belongs to main
        shell: pwsh -command "Set-StrictMode -Version Latest; $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; . '{0}'"
        run: |
          git fetch --no-tags origin main
          $mergeBase = (git merge-base $env:GITHUB_SHA origin/main).Trim()
          if ($mergeBase -ne $env:GITHUB_SHA) {
              throw "Release commit $env:GITHUB_SHA is not contained in main."
          }

  check:
    needs: validate-release
    permissions:
      contents: read
    uses: ./.github/workflows/check.yml

  build:
    needs: [validate-release, check]
    uses: ./.github/workflows/swift.yml
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    with:
      release-build: true

  draft-release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: read
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          persist-credentials: false

      - name: Download installer package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: ${{ runner.temp }}/release-assets

      - name: Verify installer package attestation
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALLER_PACKAGE_PATH: ${{ runner.temp }}/release-assets/${{ needs.build.outputs.artifact }}
        run: |
          gh attestation verify "$INSTALLER_PACKAGE_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/swift.yml" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA" \
            --signer-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners

      - name: Create or update draft GitHub release
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALLER_PACKAGE_PATH: ${{ runner.temp }}/release-assets/${{ needs.build.outputs.artifact }}
        run: |
          git fetch --force --no-tags origin "refs/tags/$GITHUB_REF_NAME:refs/release-verification/tag"
          tag_sha="$(git rev-parse 'refs/release-verification/tag^{commit}')"
          if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
            echo "Release tag $GITHUB_REF_NAME no longer points to $GITHUB_SHA." >&2
            exit 1
          fi
          is_draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ -z "$is_draft" ]]; then
            gh release create "$GITHUB_REF_NAME" "$INSTALLER_PACKAGE_PATH" \
              --draft \
              --generate-notes \
              --title "$GITHUB_REF_NAME" \
              --verify-tag
          elif [[ "$is_draft" == 'true' ]]; then
            gh release upload "$GITHUB_REF_NAME" "$INSTALLER_PACKAGE_PATH" --clobber
          else
            echo "Release $GITHUB_REF_NAME is already published." >&2
            exit 1
          fi
