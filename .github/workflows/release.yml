name: Release macOS

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

env:
  DMG_PREDICATE_TYPE: https://kaito.tokyo/attestations/apple-notarized-disk-image/v1
  PLUGIN_PREDICATE_TYPE: https://kaito.tokyo/attestations/codex-plugin/v1
  UNSIGNED_ARCHIVE_NAME: unite-analysis-swift-unsigned-macos-arm64-${{ github.sha }}.tar.gz

jobs:
  validate-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      actions: read
      contents: read

    outputs:
      swift_run_id: ${{ steps.swift-run.outputs.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Check plugin package version
        shell: pwsh -command "Set-StrictMode -Version Latest; $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; . '{0}'"
        run: |
          $packageVersion = (jq -er '.version' .codex-plugin/plugin.json).Trim()
          $tagVersion = $env:GITHUB_REF_NAME.Substring(1)
          if ($packageVersion -ne $tagVersion) {
              throw "Plugin version $packageVersion does not match tag version $tagVersion."
          }

      - name: Check if the release commit belongs to main
        shell: pwsh -command "Set-StrictMode -Version Latest; $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; . '{0}'"
        run: |
          git fetch --no-tags origin main
          $mergeBase = (git merge-base $env:GITHUB_SHA origin/main).Trim()

          if ($mergeBase -ne $env:GITHUB_SHA) {
              throw "Release commit $env:GITHUB_SHA is not contained in main."
          }

      - name: Find successful main push
        id: swift-run
        shell: pwsh -command "Set-StrictMode -Version Latest; $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; . '{0}'"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $runId = gh run list --workflow push-main.yml --branch main --commit $env:GITHUB_SHA --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId'
          if ([string]::IsNullOrWhiteSpace($runId)) {
              throw "Successful main push run was not found for release commit $env:GITHUB_SHA."
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "run_id=$runId" -Encoding utf8

  sign-release:
    needs: validate-release
    runs-on: macos-26
    environment: release-macos
    timeout-minutes: 60
    env:
      APP_STORE_CONNECT_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER }}
      APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      MACOS_SIGNING_APPLICATION_IDENTITY: ${{ vars.MACOS_SIGNING_APPLICATION_IDENTITY }}
      MACOS_SIGNING_CERT: ${{ secrets.MACOS_SIGNING_CERT }}
      MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}

    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write

    outputs:
      disk_image_name: ${{ steps.package.outputs.disk_image_name }}
      plugin_archive_name: ${{ steps.package-plugin.outputs.plugin_archive_name }}

    steps:
      - name: Download release build
        id: download-release-build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.UNSIGNED_ARCHIVE_NAME }}
          path: ${{ runner.temp }}/release-build-download
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.validate-release.outputs.swift_run_id }}

      - name: Verify release build attestation
        id: release-attestation
        shell: pwsh -command "Set-StrictMode -Version Latest; $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; . '{0}'"
        env:
          DOWNLOAD_DIRECTORY: ${{ steps.download-release-build.outputs.download-path }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $signerWorkflow = "$env:GITHUB_REPOSITORY/.github/workflows/swift.yml"
          $archivePath = Join-Path $env:DOWNLOAD_DIRECTORY $env:UNSIGNED_ARCHIVE_NAME
          if (-not (Test-Path -LiteralPath $archivePath -PathType Leaf)) {
              throw 'Release products archive is missing.'
          }
          gh attestation verify $archivePath `
              --repo $env:GITHUB_REPOSITORY `
              --signer-workflow $signerWorkflow `
              --source-ref refs/heads/main `
              --source-digest $env:GITHUB_SHA `
              --signer-digest $env:GITHUB_SHA `
              --deny-self-hosted-runners
          $archiveDigest = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "archive_sha256=$archiveDigest" -Encoding utf8

      - name: Extract release build
        id: release-build
        shell: pwsh -command "Set-StrictMode -Version Latest; $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; . '{0}'"
        env:
          ARCHIVE_PATH: ${{ steps.download-release-build.outputs.download-path }}/${{ env.UNSIGNED_ARCHIVE_NAME }}
        run: |
          $stagingDirectory = Join-Path $env:RUNNER_TEMP 'release-build'
          New-Item -ItemType Directory -Path $stagingDirectory | Out-Null
          tar -xzf $env:ARCHIVE_PATH -C $stagingDirectory

          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "runtime_binary_path=$(Join-Path $stagingDirectory 'unite-analysis-swift')" -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "model_tool_binary_path=$(Join-Path $stagingDirectory 'unite-analysis-model-tool')" -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "staging_directory=$stagingDirectory" -Encoding utf8

      - name: Validate release products
        id: release-products
        shell: pwsh -command "Set-StrictMode -Version Latest; $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; . '{0}'"
        env:
          RUNTIME_BINARY_PATH: ${{ steps.release-build.outputs.runtime_binary_path }}
          MODEL_TOOL_BINARY_PATH: ${{ steps.release-build.outputs.model_tool_binary_path }}
          DESCRIPTORS_PATH: ${{ steps.release-build.outputs.staging_directory }}/descriptors.pb
          SOURCE_DIRECTORY: ${{ steps.release-build.outputs.staging_directory }}
        run: |
          foreach ($productPath in @($env:RUNTIME_BINARY_PATH, $env:MODEL_TOOL_BINARY_PATH, $env:DESCRIPTORS_PATH)) {
              if (-not (Test-Path -LiteralPath $productPath -PathType Leaf)) {
                  throw "Release product $productPath is missing."
              }
          }

          chmod +x $env:RUNTIME_BINARY_PATH $env:MODEL_TOOL_BINARY_PATH
          $expectedVersion = $env:GITHUB_REF_NAME.Substring(1)
          $actualVersion = (& $env:RUNTIME_BINARY_PATH --version).Trim()
          if ($actualVersion -ne $expectedVersion) {
              throw "CLI version $actualVersion does not match tag version $expectedVersion."
          }
          $modelToolVersion = (& $env:MODEL_TOOL_BINARY_PATH --version).Trim()
          if ($modelToolVersion -ne $expectedVersion) {
              throw "Model tool version $modelToolVersion does not match tag version $expectedVersion."
          }
          $pluginVersion = (Get-Content -LiteralPath (Join-Path $env:SOURCE_DIRECTORY '.codex-plugin/plugin.json') -Raw | ConvertFrom-Json).version
          $appVersion = (/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' (Join-Path $env:SOURCE_DIRECTORY 'Packaging/App/Info.plist')).Trim()
          if ($pluginVersion -ne $expectedVersion -or $appVersion -ne $expectedVersion) {
              throw "Plugin ($pluginVersion), app ($appVersion), and tag ($expectedVersion) versions must match."
          }

          $descriptorsDigest = (Get-FileHash -LiteralPath $env:DESCRIPTORS_PATH -Algorithm SHA256).Hash.ToLowerInvariant()
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "descriptors_sha256=$descriptorsDigest" -Encoding utf8

      - name: Set up Apple code signing
        uses: kaito-tokyo/setup-apple-codesigning@b9f7d7c6819fe6f6bb44694b75963918dcbddd27 # v1.0.0
        with:
          MACOS_SIGNING_CERT: ${{ env.MACOS_SIGNING_CERT }}
          MACOS_SIGNING_CERT_PASSWORD: ${{ env.MACOS_SIGNING_CERT_PASSWORD }}

      - name: Sign release executables
        id: sign
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          RUNTIME_BINARY_PATH: ${{ steps.release-build.outputs.runtime_binary_path }}
          MODEL_TOOL_BINARY_PATH: ${{ steps.release-build.outputs.model_tool_binary_path }}
        run: |
          if [[ -z "$MACOS_SIGNING_APPLICATION_IDENTITY" ]]; then
            echo 'MACOS_SIGNING_APPLICATION_IDENTITY is not configured.' >&2
            exit 1
          fi

          available_identities="$(security find-identity -v -p codesigning)"
          if [[ "$available_identities" != *"\"$MACOS_SIGNING_APPLICATION_IDENTITY\""* ]]; then
            echo "Signing identity $MACOS_SIGNING_APPLICATION_IDENTITY was not found." >&2
            exit 1
          fi

          for binary_path in "$RUNTIME_BINARY_PATH" "$MODEL_TOOL_BINARY_PATH"; do
            codesign --force --options runtime --timestamp --sign "$MACOS_SIGNING_APPLICATION_IDENTITY" "$binary_path"
            codesign --verify --strict --verbose=2 "$binary_path"
          done
          {
            printf 'runtime_signed_sha256=%s\n' "$(shasum -a 256 "$RUNTIME_BINARY_PATH" | awk '{print $1}')"
            printf 'model_tool_signed_sha256=%s\n' "$(shasum -a 256 "$MODEL_TOOL_BINARY_PATH" | awk '{print $1}')"
          } >> "$GITHUB_OUTPUT"

      - name: Assemble and sign app bundle
        id: app
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          SOURCE_DIRECTORY: ${{ steps.release-build.outputs.staging_directory }}
          RUNTIME_BINARY_PATH: ${{ steps.release-build.outputs.runtime_binary_path }}
          MODEL_TOOL_BINARY_PATH: ${{ steps.release-build.outputs.model_tool_binary_path }}
        run: |
          app_path="$RUNNER_TEMP/unite-analysis-swift.app"
          mkdir -p "$app_path/Contents/MacOS" "$app_path/Contents/Resources"
          ditto --norsrc "$SOURCE_DIRECTORY/Packaging/App/Info.plist" "$app_path/Contents/Info.plist"
          ditto --norsrc "$RUNTIME_BINARY_PATH" "$app_path/Contents/MacOS/unite-analysis-swift"
          ditto --norsrc "$MODEL_TOOL_BINARY_PATH" "$app_path/Contents/MacOS/unite-analysis-model-tool"
          ditto --norsrc "$SOURCE_DIRECTORY/descriptors.pb" "$app_path/Contents/Resources/descriptors.pb"
          codesign --force --options runtime --timestamp --sign "$MACOS_SIGNING_APPLICATION_IDENTITY" "$app_path"
          codesign --verify --strict --verbose=2 "$app_path"
          printf 'app_path=%s\n' "$app_path" >> "$GITHUB_OUTPUT"

      - name: Notarize and staple app bundle
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          APP_PATH: ${{ steps.app.outputs.app_path }}
        run: |
          key_path="$(mktemp)"
          submission_path="$RUNNER_TEMP/unite-analysis-swift-notarization.zip"
          trap 'rm -f "$key_path" "$submission_path"' EXIT
          printf '%s' "$APP_STORE_CONNECT_KEY_BASE64" | base64 -D > "$key_path"
          chmod 600 "$key_path"
          ditto -c -k --keepParent "$APP_PATH" "$submission_path"
          xcrun notarytool submit "$submission_path" \
            --key "$key_path" \
            --key-id "$APP_STORE_CONNECT_KEY_ID" \
            --issuer "$APP_STORE_CONNECT_ISSUER" \
            --wait
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          codesign --verify --strict --check-notarization --verbose=2 "$APP_PATH"
          spctl --assess --type execute --verbose=2 "$APP_PATH"

      - name: Package release products
        id: package
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          SOURCE_DIRECTORY: ${{ steps.release-build.outputs.staging_directory }}
        run: |
          architecture="$(uname -m)"
          artifact_name="unite-analysis-swift-$GITHUB_REF_NAME-macos-$architecture"
          staging_directory="$RUNNER_TEMP/$artifact_name"
          disk_image_path="$RUNNER_TEMP/$artifact_name.dmg"

          mkdir -p "$staging_directory"
          for product in unite-analysis-swift unite-analysis-model-tool descriptors.pb; do
            ditto --norsrc "$SOURCE_DIRECTORY/$product" "$staging_directory/$product"
          done
          hdiutil create \
            -srcfolder "$staging_directory" \
            -volname "$artifact_name" \
            -format ULFO \
            "$disk_image_path"
          hdiutil verify "$disk_image_path"
          disk_image_format="$(hdiutil imageinfo -format "$disk_image_path")"
          if [[ "$disk_image_format" != ULFO ]]; then
            echo "Release disk image has unexpected format $disk_image_format." >&2
            exit 1
          fi
          codesign --force --timestamp --sign "$MACOS_SIGNING_APPLICATION_IDENTITY" "$disk_image_path"
          codesign --verify --strict --verbose=2 "$disk_image_path"
          printf 'disk_image_name=%s.dmg\n' "$artifact_name" >> "$GITHUB_OUTPUT"
          printf 'disk_image_path=%s\n' "$disk_image_path" >> "$GITHUB_OUTPUT"

      - name: Notarize and staple disk image
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          DISK_IMAGE_PATH: ${{ steps.package.outputs.disk_image_path }}
        run: |
          key_path="$(mktemp)"
          trap 'rm -f "$key_path"' EXIT
          printf '%s' "$APP_STORE_CONNECT_KEY_BASE64" | base64 -D > "$key_path"
          chmod 600 "$key_path"

          xcrun notarytool submit "$DISK_IMAGE_PATH" \
            --key "$key_path" \
            --key-id "$APP_STORE_CONNECT_KEY_ID" \
            --issuer "$APP_STORE_CONNECT_ISSUER" \
            --wait
          xcrun stapler staple "$DISK_IMAGE_PATH"
          xcrun stapler validate "$DISK_IMAGE_PATH"
          hdiutil verify "$DISK_IMAGE_PATH"
          codesign --verify --strict --check-notarization --verbose=2 "$DISK_IMAGE_PATH"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DISK_IMAGE_PATH"

      - name: Package Codex plugin
        id: package-plugin
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          APP_PATH: ${{ steps.app.outputs.app_path }}
          SOURCE_DIRECTORY: ${{ steps.release-build.outputs.staging_directory }}
        run: |
          plugin_root="$RUNNER_TEMP/unite-analysis-swift"
          plugin_archive="$RUNNER_TEMP/unite-analysis-swift-$GITHUB_REF_NAME-codex-plugin.zip"
          mkdir -p "$plugin_root/runtime"
          ditto --norsrc "$SOURCE_DIRECTORY/.codex-plugin" "$plugin_root/.codex-plugin"
          ditto --norsrc "$SOURCE_DIRECTORY/.mcp.json" "$plugin_root/.mcp.json"
          ditto --norsrc "$SOURCE_DIRECTORY/skills" "$plugin_root/skills"
          ditto --norsrc "$SOURCE_DIRECTORY/LICENSE" "$plugin_root/LICENSE"
          ditto --norsrc "$SOURCE_DIRECTORY/NOTICE" "$plugin_root/NOTICE"
          ditto --norsrc "$APP_PATH" "$plugin_root/runtime/unite-analysis-swift.app"
          ditto -c -k --keepParent "$plugin_root" "$plugin_archive"
          printf 'plugin_archive_name=%s\n' "${plugin_archive##*/}" >> "$GITHUB_OUTPUT"
          printf 'plugin_archive_path=%s\n' "$plugin_archive" >> "$GITHUB_OUTPUT"

      - name: Attest Codex plugin
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.package-plugin.outputs.plugin_archive_path }}
          predicate-type: ${{ env.PLUGIN_PREDICATE_TYPE }}
          predicate: |
            {
              "plugin": "unite-analysis-swift",
              "version": "${{ github.ref_name }}",
              "app_bundle": "unite-analysis-swift.app",
              "input_archive": {
                "name": "${{ env.UNSIGNED_ARCHIVE_NAME }}",
                "sha256": "${{ steps.release-attestation.outputs.archive_sha256 }}"
              },
              "source_commit": "${{ github.sha }}"
            }

      - name: Attest release disk image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.disk_image_path }}
          predicate-type: ${{ env.DMG_PREDICATE_TYPE }}
          predicate: |
            {
              "input": {
                "archive": {
                  "name": "${{ env.UNSIGNED_ARCHIVE_NAME }}",
                  "digest": {
                    "sha256": "${{ steps.release-attestation.outputs.archive_sha256 }}"
                  },
                  "predicate_type": "https://slsa.dev/provenance/v1"
                },
                "products": {
                  "signed_executables": {
                    "digest": {
                      "unite-analysis-swift.sha256": "${{ steps.sign.outputs.runtime_signed_sha256 }}",
                      "unite-analysis-model-tool.sha256": "${{ steps.sign.outputs.model_tool_signed_sha256 }}"
                    }
                  },
                  "descriptor_database": {
                    "name": "descriptors.pb",
                    "digest": {
                      "sha256": "${{ steps.release-products.outputs.descriptors_sha256 }}"
                    }
                  }
                }
              },
              "operations": [
                {
                  "name": "create-disk-image",
                  "tool": "hdiutil",
                  "format": "ULFO"
                },
                {
                  "name": "apple-codesign",
                  "tool": "codesign",
                  "identity": ${{ toJSON(vars.MACOS_SIGNING_APPLICATION_IDENTITY) }}
                },
                {
                  "name": "apple-notarization",
                  "tool": "notarytool"
                },
                {
                  "name": "staple-notarization-ticket",
                  "tool": "stapler"
                }
              ],
              "source_commit": "${{ github.sha }}"
            }

      - name: Upload signed release disk image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.package.outputs.disk_image_path }}
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload Codex plugin
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.package-plugin.outputs.plugin_archive_path }}
          archive: false
          if-no-files-found: error
          retention-days: 30

  draft-release:
    needs: sign-release
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      actions: read
      attestations: read
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          persist-credentials: false

      - name: Download signed release disk image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.sign-release.outputs.disk_image_name }}
          path: ${{ runner.temp }}/signed-release

      - name: Download Codex plugin
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.sign-release.outputs.plugin_archive_name }}
          path: ${{ runner.temp }}/signed-release

      - name: Verify release disk image attestation
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          GH_TOKEN: ${{ github.token }}
          DISK_IMAGE_PATH: ${{ runner.temp }}/signed-release/${{ needs.sign-release.outputs.disk_image_name }}
        run: |
          gh attestation verify "$DISK_IMAGE_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --predicate-type "$DMG_PREDICATE_TYPE" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA" \
            --signer-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners

      - name: Verify Codex plugin attestation
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          GH_TOKEN: ${{ github.token }}
          PLUGIN_ARCHIVE_PATH: ${{ runner.temp }}/signed-release/${{ needs.sign-release.outputs.plugin_archive_name }}
        run: |
          gh attestation verify "$PLUGIN_ARCHIVE_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --predicate-type "$PLUGIN_PREDICATE_TYPE" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA" \
            --signer-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners

      - name: Create or update draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          DISK_IMAGE_PATH: ${{ runner.temp }}/signed-release/${{ needs.sign-release.outputs.disk_image_name }}
          PLUGIN_ARCHIVE_PATH: ${{ runner.temp }}/signed-release/${{ needs.sign-release.outputs.plugin_archive_name }}
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          git fetch --force --no-tags origin "refs/tags/$GITHUB_REF_NAME:refs/release-verification/tag"
          tag_sha="$(git rev-parse 'refs/release-verification/tag^{commit}')"
          if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
            echo "Release tag $GITHUB_REF_NAME no longer points to $GITHUB_SHA." >&2
            exit 1
          fi

          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$DISK_IMAGE_PATH" "$PLUGIN_ARCHIVE_PATH" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$DISK_IMAGE_PATH" "$PLUGIN_ARCHIVE_PATH" \
              --draft \
              --generate-notes \
              --title "$GITHUB_REF_NAME" \
              --verify-tag
          fi
