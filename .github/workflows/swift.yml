name: Release build

on:
  workflow_call:
    outputs:
      artifact:
        description: Name of the uploaded notarized installer package.
        value: ${{ jobs.swift-ci.outputs.artifact }}

jobs:
  swift-ci:
    runs-on: macos-26
    environment: release-macos
    timeout-minutes: 60
    outputs:
      artifact: ${{ steps.release-package.outputs.artifact_name }}
    steps:
      - name: Set up Apple code signing
        uses: kaito-tokyo/setup-apple-codesigning@b9f7d7c6819fe6f6bb44694b75963918dcbddd27 # v1.0.0
        with:
          MACOS_SIGNING_CERT: ${{ secrets.MACOS_SIGNING_CERT }}
          MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}

      - name: Validate release credentials
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          APP_STORE_CONNECT_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER }}
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          MACOS_SIGNING_APPLICATION_IDENTITY: ${{ vars.MACOS_SIGNING_APPLICATION_IDENTITY }}
          MACOS_SIGNING_INSTALLER_IDENTITY: ${{ vars.MACOS_SIGNING_INSTALLER_IDENTITY }}
        run: |
          for name in \
            APP_STORE_CONNECT_ISSUER \
            APP_STORE_CONNECT_KEY_BASE64 \
            APP_STORE_CONNECT_KEY_ID \
            MACOS_SIGNING_APPLICATION_IDENTITY \
            MACOS_SIGNING_INSTALLER_IDENTITY; do
            if [[ -z "${!name}" ]]; then
              printf '%s is not configured.\n' "$name" >&2
              exit 1
            fi
          done

      - name: Print Xcode version
        id: xcode
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          XCODE_VERSION="$(xcodebuild -version | awk '{print $NF}' | paste -s -d _ -)"
          printf 'version=%s\n' "$XCODE_VERSION" | tee -a "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Calculate SwiftPM build cache key
        id: swiftpm-cache-key
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          BUILD_INPUTS_HASH="$({
            git rev-parse HEAD:Package.swift
            git rev-parse HEAD:Package.resolved
            git rev-parse HEAD:Sources
            git rev-parse HEAD:Tests
            git rev-parse HEAD:Vendor/opencv
            git rev-parse HEAD:Vendor/opencv-config
            git rev-parse HEAD:Vendor/opencv_contrib
            git rev-parse HEAD:Vendor/nanopb
          } | shasum -a 256 | awk '{print $1}')"
          printf 'build-inputs-hash=%s\n' "$BUILD_INPUTS_HASH" >>"$GITHUB_OUTPUT"

      - name: Restore SwiftPM build cache
        id: swiftpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: build-swift-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ steps.swiftpm-cache-key.outputs.build-inputs-hash }}
          restore-keys: |
            build-swift-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-
            build-swift-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-
            build-swift-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-

      - name: Build
        shell: bash --noprofile --norc -euo pipefail {0}
        run: swift build -c release

      - name: Test
        shell: bash --noprofile --norc -euo pipefail {0}
        run: swift test -c release

      - name: Save SwiftPM build cache
        if: github.event_name == 'push' && steps.swiftpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ steps.swiftpm-cache.outputs.cache-primary-key }}

      - name: Assemble app bundle
        id: app
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          APP_PATH: ${{ runner.temp }}/Kaito-Tokyo Unite Analysis.app
        run: |
          bin_path="$(swift build --show-bin-path -c release)"
          install -d "$APP_PATH"
          cp -R Contents "$APP_PATH/"
          install -d "$APP_PATH/Contents/MacOS"
          install -m 755 \
            "$bin_path/unite-analysis-swift" \
            "$bin_path/unite-analysis-model-tool" \
            "$APP_PATH/Contents/MacOS/"
          install -m 644 LICENSE NOTICE "$APP_PATH/Contents/Resources/"
          cp -R LICENSES "$APP_PATH/Contents/Resources/"
          printf 'app_path=%s\n' "$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Validate app bundle
        shell: pwsh -command "Set-StrictMode -Version Latest; $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; . '{0}'"
        env:
          APP_PATH: ${{ steps.app.outputs.app_path }}
          DESCRIPTORS_PATH: ${{ steps.app.outputs.app_path }}/Contents/Resources/descriptors.pb
          LICENSE_PATH: ${{ steps.app.outputs.app_path }}/Contents/Resources/LICENSE
          LICENSES_PATH: ${{ steps.app.outputs.app_path }}/Contents/Resources/LICENSES
          MODEL_TOOL_BINARY_PATH: ${{ steps.app.outputs.app_path }}/Contents/MacOS/unite-analysis-model-tool
          NOTICE_PATH: ${{ steps.app.outputs.app_path }}/Contents/Resources/NOTICE
          RUNTIME_BINARY_PATH: ${{ steps.app.outputs.app_path }}/Contents/MacOS/unite-analysis-swift
        run: |
          foreach ($productPath in @($env:RUNTIME_BINARY_PATH, $env:MODEL_TOOL_BINARY_PATH, $env:DESCRIPTORS_PATH, $env:LICENSE_PATH, $env:NOTICE_PATH, (Join-Path $env:APP_PATH 'Contents/Info.plist'))) {
              if (-not (Test-Path -LiteralPath $productPath -PathType Leaf)) {
                  throw "Build product $productPath is missing."
              }
          }
          if (-not (Test-Path -LiteralPath $env:LICENSES_PATH -PathType Container)) {
              throw "Build product $env:LICENSES_PATH is missing."
          }

          if ($env:GITHUB_REF_TYPE -ne 'tag') {
              throw 'A release build must run for a tag.'
          }
          $expectedVersion = $env:GITHUB_REF_NAME.Substring(1)
          $versions = @(
              (& $env:RUNTIME_BINARY_PATH --version).Trim()
              (& $env:MODEL_TOOL_BINARY_PATH --version).Trim()
              (/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' (Join-Path $env:APP_PATH 'Contents/Info.plist')).Trim()
          )
          foreach ($version in $versions) {
              if ($version -ne $expectedVersion) {
                  throw "Build product version $version does not match tag version $expectedVersion."
              }
          }

      - name: Sign app bundle
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          APP_PATH: ${{ steps.app.outputs.app_path }}
          MACOS_SIGNING_APPLICATION_IDENTITY: ${{ vars.MACOS_SIGNING_APPLICATION_IDENTITY }}
        run: |
          if [[ -z "$MACOS_SIGNING_APPLICATION_IDENTITY" ]]; then
            echo 'MACOS_SIGNING_APPLICATION_IDENTITY is not configured.' >&2
            exit 1
          fi
          for binary_path in \
            "$APP_PATH/Contents/MacOS/unite-analysis-swift" \
            "$APP_PATH/Contents/MacOS/unite-analysis-model-tool"; do
            codesign --force --options runtime --timestamp --sign "$MACOS_SIGNING_APPLICATION_IDENTITY" "$binary_path"
            codesign --verify --strict --verbose=2 "$binary_path"
          done
          codesign --force --options runtime --timestamp --sign "$MACOS_SIGNING_APPLICATION_IDENTITY" "$APP_PATH"
          codesign --verify --strict --verbose=2 "$APP_PATH"

      - name: Package signed installer
        id: release-package
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          APP_PATH: ${{ steps.app.outputs.app_path }}
          MACOS_SIGNING_INSTALLER_IDENTITY: ${{ vars.MACOS_SIGNING_INSTALLER_IDENTITY }}
        run: |
          if [[ -z "$MACOS_SIGNING_INSTALLER_IDENTITY" ]]; then
            echo 'MACOS_SIGNING_INSTALLER_IDENTITY is not configured.' >&2
            exit 1
          fi
          component_root="$RUNNER_TEMP/installer-root"
          component_package="$RUNNER_TEMP/unite-analysis-swift-component.pkg"
          resources_directory="$RUNNER_TEMP/installer-resources"
          artifact_name="unite-analysis-swift-$GITHUB_REF_NAME-macos-$(uname -m).pkg"
          installer_package="$RUNNER_TEMP/$artifact_name"
          install -d "$component_root" "$resources_directory"
          cp -R "$APP_PATH" "$component_root/"
          install -m 644 LICENSE "$resources_directory/"
          COPYFILE_DISABLE=1 pkgbuild \
            --root "$component_root" \
            --component-plist pkg/Components.plist \
            --identifier tokyo.kaito.unite-analysis-swift \
            --version "${GITHUB_REF_NAME#v}" \
            --install-location /Applications \
            "$component_package"
          productbuild \
            --distribution pkg/Distribution.xml \
            --package-path "$RUNNER_TEMP" \
            --resources "$resources_directory" \
            --sign "$MACOS_SIGNING_INSTALLER_IDENTITY" \
            "$installer_package"
          pkgutil --check-signature "$installer_package"
          printf 'artifact_name=%s\n' "$artifact_name" >> "$GITHUB_OUTPUT"
          printf 'artifact_path=%s\n' "$installer_package" >> "$GITHUB_OUTPUT"

      - name: Notarize and staple installer
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          APP_STORE_CONNECT_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER }}
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          INSTALLER_PACKAGE_PATH: ${{ steps.release-package.outputs.artifact_path }}
        run: |
          key_path="$(mktemp)"
          trap 'rm -f "$key_path"' EXIT
          printf '%s' "$APP_STORE_CONNECT_KEY_BASE64" | base64 -D > "$key_path"
          chmod 600 "$key_path"
          xcrun notarytool submit "$INSTALLER_PACKAGE_PATH" \
            --key "$key_path" \
            --key-id "$APP_STORE_CONNECT_KEY_ID" \
            --issuer "$APP_STORE_CONNECT_ISSUER" \
            --wait
          xcrun stapler staple "$INSTALLER_PACKAGE_PATH"
          xcrun stapler validate "$INSTALLER_PACKAGE_PATH"
          pkgutil --check-signature "$INSTALLER_PACKAGE_PATH"
          spctl --assess --type install --verbose=2 "$INSTALLER_PACKAGE_PATH"

      - name: Attest notarized installer package
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.release-package.outputs.artifact_path }}

      - name: Upload installer package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.release-package.outputs.artifact_path }}
          archive: false
          if-no-files-found: error
          retention-days: 30
