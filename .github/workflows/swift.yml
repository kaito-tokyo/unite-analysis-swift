name: Swift CI

on:
  workflow_call:
    inputs:
      app-name:
        description: Name of the macOS app bundle
        type: string
      upload-artifacts:
        description: Package, attest, and upload release products
        type: boolean
        default: false
    outputs:
      UNSIGNED_ARM64_ARTIFACT_NAME:
        description: Name of the uploaded unsigned release archive
        value: ${{ jobs.swift-ci.outputs.UNSIGNED_ARM64_ARTIFACT_NAME }}

jobs:
  swift-ci:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      APP_NAME: ${{ inputs.app-name }}
      UNSIGNED_ARM64_ARTIFACT_NAME: unite-analysis-swift-unsigned-macOS-arm64-${{ github.run_id }}.tar.gz
    outputs:
      UNSIGNED_ARM64_ARTIFACT_NAME: ${{ env.UNSIGNED_ARM64_ARTIFACT_NAME }}

    steps:
      - name: Print Xcode version
        id: xcode
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          XCODE_VERSION="$(xcodebuild -version | awk '{print $NF}' | paste -s -d _ -)"
          printf 'version=%s\n' "$XCODE_VERSION" | tee -a "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Calculate SwiftPM build cache key
        id: swiftpm-cache-key
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          BUILD_INPUTS_HASH="$({
            git rev-parse HEAD:Package.swift
            git rev-parse HEAD:Package.resolved
            git rev-parse HEAD:Sources
            git rev-parse HEAD:Tests
            git rev-parse HEAD:Vendor/opencv
            git rev-parse HEAD:Vendor/opencv-config
            git rev-parse HEAD:Vendor/opencv_contrib
            git rev-parse HEAD:Vendor/nanopb
          } | shasum -a 256 | awk '{print $1}')"
          printf 'build-inputs-hash=%s\n' "$BUILD_INPUTS_HASH" >>"$GITHUB_OUTPUT"

      - name: Restore SwiftPM build cache
        id: swiftpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: build-swift-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ steps.swiftpm-cache-key.outputs.build-inputs-hash }}
          restore-keys: |
            build-swift-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-
            build-swift-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-
            build-swift-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-

      - name: Build
        shell: bash --noprofile --norc -euo pipefail {0}
        run: swift build -c release

      - name: Test
        shell: bash --noprofile --norc -euo pipefail {0}
        run: swift test -c release

      - name: Save SwiftPM build cache
        if: github.event_name == 'push' && steps.swiftpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ steps.swiftpm-cache.outputs.cache-primary-key }}

      - name: Create job temp directory
        id: job-temp
        if: inputs.upload-artifacts
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          JOB_TEMP="$RUNNER_TEMP/$GITHUB_JOB-$GITHUB_RUN_ID"
          mkdir -p "$JOB_TEMP"
          printf 'JOB_TEMP=%s\n' "$JOB_TEMP" >>"$GITHUB_OUTPUT"

      - name: Assemble unsigned app bundle
        id: assemble-app
        if: inputs.upload-artifacts
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          APP_PATH: ${{ steps.job-temp.outputs.JOB_TEMP }}/${{ env.APP_NAME }}
        run: |
          bin_path="$(swift build --show-bin-path -c release)"
          install -d "$APP_PATH"
          cp -R Contents "$APP_PATH/"
          cd "$APP_PATH/Contents"
          install -d MacOS
          install -m 755 \
            "$bin_path/unite-analysis-swift" \
            "$bin_path/unite-analysis-model-tool" \
            MacOS/
          install -m 644 "$GITHUB_WORKSPACE/LICENSE" "$GITHUB_WORKSPACE/NOTICE" Resources/
          cp -R "$GITHUB_WORKSPACE/LICENSES" Resources/
          printf 'APP_PATH=%s\n' "$APP_PATH" >>"$GITHUB_OUTPUT"

      - name: Create unsigned pkg artifacts
        id: pkg-artifacts
        if: inputs.upload-artifacts
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          JOB_TEMP: ${{ steps.job-temp.outputs.JOB_TEMP }}
          UNSIGNED_ARM64_ARTIFACT_PATH: ${{ steps.job-temp.outputs.JOB_TEMP }}/${{ env.UNSIGNED_ARM64_ARTIFACT_NAME }}
        run: |
          COPYFILE_DISABLE=1 tar -czf "$UNSIGNED_ARM64_ARTIFACT_PATH" \
            -C "$JOB_TEMP" \
            "$APP_NAME" \
            -C "$GITHUB_WORKSPACE" \
            LICENSE \
            pkg/Components.plist \
            pkg/Distribution.xml
          printf 'UNSIGNED_ARM64_ARTIFACT_PATH=%s\n' "$UNSIGNED_ARM64_ARTIFACT_PATH" >>"$GITHUB_OUTPUT"

      - name: Attest unsigned pkg artifacts
        if: inputs.upload-artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ steps.pkg-artifacts.outputs.UNSIGNED_ARM64_ARTIFACT_PATH }}

      - name: Upload unsigned ARM64 artifacts
        if: inputs.upload-artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.pkg-artifacts.outputs.UNSIGNED_ARM64_ARTIFACT_PATH }}
          archive: false
          if-no-files-found: error
          retention-days: 30
