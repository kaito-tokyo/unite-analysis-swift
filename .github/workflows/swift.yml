name: Swift CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-build-and-test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Print Xcode version
        id: xcode
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          printf 'version=%s\n' "$(xcodebuild -version | awk '{print $NF}' | paste -s -d _ -)" | tee -a "$GITHUB_OUTPUT"

      - name: Print Swift version
        run: swift --version

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Cache SwiftPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-
            swiftpm-${{ runner.os }}-${{ runner.arch }}-

      - name: Build release configuration
        shell: bash --noprofile --norc -euo pipefail {0}
        run: swift build --configuration release

      - name: Test
        shell: bash --noprofile --norc -euo pipefail {0}
        run: swift test

  release-build:
    name: Build and attest release
    if: github.event_name == 'push'
    needs: swift-build-and-test
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Cache SwiftPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: release-swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            release-swiftpm-${{ runner.os }}-${{ runner.arch }}-
            swiftpm-${{ runner.os }}-${{ runner.arch }}-

      - name: Build release configuration
        shell: bash --noprofile --norc -euo pipefail {0}
        run: swift build --configuration release

      - name: Attest release build
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: .build/arm64-apple-macosx/release/unite-analysis-swift

      - name: Upload release build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos-${{ github.sha }}
          path: |
            .build/arm64-apple-macosx/release/unite-analysis-swift
          if-no-files-found: error
          retention-days: 30
